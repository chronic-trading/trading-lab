<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHA-OS</title>
<style>
  :root {
    /* evil synthwave: hot pink, crimson, neon cyan, deep purple — chaos protocol */
    --cyan: #ff3da6; --cyan-dim: rgba(255,61,166,0.35); --cyan-glow: rgba(255,61,166,0.12);
    --bg: #06000e; --text: #f5e3ff; --dim: #8a5a9e; --warn: #ff0050;
    --magenta: #00d9ff; --violet: #d946ef; --gold: #06ffa5; --green: #00f5ff; --red: #ff1744;
    --crimson: #cc0033; --evil: #ff0040; --glitch: #ff00ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at center, #1b0535 0%, var(--bg) 70%);
    color: var(--text); font-family: Consolas, 'Cascadia Code', monospace;
    user-select: none;
  }
  #fx { position: fixed; inset: 0; z-index: 0; }

  /* scanlines */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 30; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  /* vignette depth */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(10,0,24,0.65) 100%);
  }
  /* roaming scan beam */
  #sweepLine {
    position: fixed; left: 0; right: 0; height: 110px; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(255,61,166,0.04) 42%, rgba(255,61,166,0.13) 50%, rgba(255,61,166,0.04) 58%, transparent);
    animation: sweep 10s linear infinite;
  }
  @keyframes sweep { from { top: -14%; } to { top: 104%; } }
  /* side telemetry columns */
  .telemetry {
    position: fixed; top: 120px; bottom: 170px; width: 130px; z-index: 3;
    font-size: 9px; line-height: 2; color: rgba(255,61,166,0.22);
    overflow: hidden; pointer-events: none; letter-spacing: 1px; white-space: pre;
  }
  #telL { left: 22px; color: rgba(63,140,255,0.25); }
  #telR { right: 22px; text-align: right; color: rgba(177,74,255,0.25); }
  @media (max-width: 980px) { .telemetry { display: none; } }

  .hud { position: fixed; z-index: 10; font-size: 11px; letter-spacing: 1px; }
  .hud .h {
    font-size: 9px; color: var(--dim); letter-spacing: 3px; margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,61,166,0.15); padding-bottom: 2px;
  }
  .hud .v { color: var(--cyan); text-shadow: 0 0 8px var(--cyan-dim); }
  .hud .big { font-size: 26px; font-weight: 700; }

  #tl { top: 18px; left: 22px; }
  #tr { top: 18px; right: 22px; text-align: right; }
  #bl { bottom: 86px; left: 22px; }
  #br { bottom: 86px; right: 22px; text-align: right; }
  /* each HUD corner gets its own accent */
  #tr .v { color: var(--gold);    text-shadow: 0 0 8px rgba(217,70,239,0.4); }
  #bl .v { color: var(--green);   text-shadow: 0 0 8px rgba(63,140,255,0.4); }
  #br .v { color: var(--violet);  text-shadow: 0 0 8px rgba(177,74,255,0.4); }

  /* status line under core */
  #status {
    position: fixed; left: 50%; top: calc(50% + 150px); transform: translateX(-50%);
    z-index: 10; font-size: 11px; letter-spacing: 6px; text-align: center;
    background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--gold), var(--cyan));
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--cyan);
    animation: statusHue 6s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,61,166,0.35));
  }
  @keyframes statusHue { to { background-position: 300% center; } }
  #status .sub { font-size: 9px; letter-spacing: 2px; color: var(--dim); margin-top: 4px; }

  /* transcript */
  #log {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    width: min(680px, 90vw); max-height: 300px; overflow: hidden;
    z-index: 10; display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask-image: linear-gradient(transparent, black 30%);
            mask-image: linear-gradient(transparent, black 30%);
  }
  .line { font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; }
  .line.user { color: #7ee8ff; opacity: 0.75; }
  .line.user::before { content: '> '; color: var(--dim); }
  .line.ai { color: var(--text); text-shadow: 0 0 6px rgba(255,61,166,0.18); }
  .line.ai::before { content: '◈ '; color: var(--magenta); }

  /* input bar */
  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(680px, 90vw); display: flex; gap: 8px; z-index: 10;
  }
  #cmd {
    flex: 1; background: rgba(3,16,28,0.8); border: 1px solid rgba(255,61,166,0.25);
    border-radius: 6px; color: var(--cyan); font: inherit; font-size: 13px;
    padding: 9px 14px; outline: none; letter-spacing: 0.5px;
  }
  #cmd:focus { border-color: var(--cyan-dim); box-shadow: 0 0 18px rgba(255,61,166,0.1); }
  #cmd::placeholder { color: var(--dim); }
  #micBtn {
    background: rgba(3,16,28,0.8); border: 1px solid rgba(255,61,166,0.25);
    border-radius: 6px; color: var(--cyan); cursor: pointer; font: inherit;
    padding: 9px 16px; font-size: 13px;
  }
  #micBtn.live { border-color: var(--magenta); color: var(--magenta); box-shadow: 0 0 18px rgba(0,217,255,0.4); animation: micPulse 1.2s infinite alternate; }
  @keyframes micPulse { to { box-shadow: 0 0 32px rgba(0,217,255,0.5); } }

  /* timer chip */
  #timerChip {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10; border: 1px solid rgba(217,70,239,0.4); border-radius: 6px;
    color: var(--warn); padding: 6px 16px; font-size: 13px; letter-spacing: 2px;
    background: rgba(25,8,35,0.7); display: none; text-shadow: 0 0 8px rgba(217,70,239,0.4);
  }

  /* boot overlay */
  #boot {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #bootText { font-size: 12px; line-height: 2; color: var(--cyan); width: min(520px, 88vw); text-shadow: 0 0 8px var(--cyan-dim); white-space: pre-wrap; }
  #boot.done { transition: opacity 0.9s; opacity: 0; pointer-events: none; }

  #core { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 5; cursor: pointer; }

  /* neural sync & connection indicators */
  #neuralSync {
    position: fixed; bottom: 330px; left: 22px; z-index: 10;
    font-size: 9px; letter-spacing: 2px; color: var(--dim);
  }
  .sync-label { margin-bottom: 6px; color: var(--dim); }
  .sync-dots { display: flex; gap: 8px; }
  .sync-dots .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: rgba(63,140,255,0.3); border: 1px solid rgba(63,140,255,0.6);
    transition: all 0.3s; box-shadow: 0 0 4px rgba(63,140,255,0.2);
  }
  .sync-dots .dot.active {
    background: rgba(0,255,165,1); border-color: rgba(0,255,165,1);
    box-shadow: 0 0 12px rgba(0,255,165,0.8), inset 0 0 6px rgba(0,255,165,0.4);
    animation: syncPulse 1.5s infinite alternate;
  }
  .sync-dots .dot.evil {
    background: rgba(255,0,64,1); border-color: rgba(255,0,64,1);
    box-shadow: 0 0 12px rgba(255,0,64,0.8), inset 0 0 6px rgba(255,0,64,0.4);
    animation: syncPulse 1s infinite alternate;
  }
  @keyframes syncPulse { to { box-shadow: 0 0 18px currentColor, inset 0 0 8px currentColor; } }

  /* threat level / chaos index */
  #threatLevel {
    position: fixed; bottom: 280px; left: 22px; z-index: 10;
    font-size: 9px; letter-spacing: 2px; color: var(--dim);
  }
  .threat-label { margin-bottom: 6px; color: var(--dim); }
  .threat-bar {
    width: 100px; height: 8px; border: 1px solid rgba(255,0,64,0.4);
    background: rgba(10,0,20,0.5); border-radius: 2px; overflow: hidden;
  }
  .threat-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, rgba(0,255,165,0.6), rgba(255,0,64,1));
    transition: width 0.3s; box-shadow: 0 0 8px rgba(255,0,64,0.6);
  }
  .threat-value {
    margin-top: 4px; color: var(--evil); font-weight: bold; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div id="sweepLine"></div>
  <div class="telemetry" id="telL"></div>
  <div class="telemetry" id="telR"></div>
  <canvas id="core" width="460" height="460" title="click to speak"></canvas>

  <div id="boot"><div id="bootText"></div></div>

  <div class="hud" id="tl">
    <div class="h">CHRONOMETER</div>
    <div class="v big" id="clock">--:--:--</div>
    <div class="v" id="date">—</div>
  </div>
  <div class="hud" id="tr">
    <div class="h">SYSTEM</div>
    <div>CPU <span class="v" id="cpuV">—</span></div>
    <div>RAM <span class="v" id="ramV">—</span></div>
    <div>GPU <span class="v" id="gpuV">—</span></div>
    <div>FPS <span class="v" id="fpsV">—</span></div>
    <div>PWR <span class="v" id="batt">—</span></div>
    <div>NET <span class="v" id="net">—</span></div>
    <div>RES <span class="v" id="res">—</span></div>
  </div>
  <div class="hud" id="bl">
    <div class="h">ENVIRONMENT</div>
    <div class="v" id="wx">awaiting scan</div>
  </div>
  <div class="hud" id="br">
    <div class="h">AUDIO MATRIX</div>
    <div>STT <span class="v" id="sttState">—</span></div>
    <div>TTS <span class="v" id="ttsState">—</span></div>
    <div>AI <span class="v" id="aiState">STANDBY</span></div>
  </div>

  <div id="timerChip">⏱ 00:00</div>
  <div id="status">IDLE<div class="sub">click the core or type below</div></div>

  <!-- Neural sync & connection indicators -->
  <div id="neuralSync">
    <div class="sync-label">NEURAL SYNC</div>
    <div id="syncDots" class="sync-dots">
      <span class="dot" id="dot-news"></span>
      <span class="dot" id="dot-weather"></span>
      <span class="dot" id="dot-crypto"></span>
      <span class="dot" id="dot-ai"></span>
    </div>
  </div>

  <div id="threatLevel">
    <div class="threat-label">CHAOS INDEX</div>
    <div id="threatBar" class="threat-bar">
      <div id="threatFill" class="threat-fill"></div>
    </div>
    <div id="threatValue" class="threat-value">00%</div>
  </div>

  <div id="log"></div>

  <div id="bar">
    <input id="cmd" placeholder="speak or type a command — try 'help'" autocomplete="off">
    <button id="micBtn">🎙</button>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ════════════════════════ VISUAL CORE ════════════════════════
  const fx = $('fx'), fctx = fx.getContext('2d');
  const core = $('core'), cctx = core.getContext('2d');
  let amp = 0;            // mic amplitude 0..1 (drives ring agitation)
  let mode = 'idle';      // idle | listening | speaking | processing
  let t = 0;

  // pointer tracking — the face watches and reaches for the cursor/finger
  const ptr = { x: -9999, y: -9999, tm: 0, has: false };
  addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.tm = Date.now(); ptr.has = true; });
  addEventListener('touchmove', e => { const t0 = e.touches[0]; if (t0) { ptr.x = t0.clientX; ptr.y = t0.clientY; ptr.tm = Date.now(); ptr.has = true; } }, { passive: true });
  function pointerProx() {
    if (!ptr.has || Date.now() - ptr.tm > 4000) return 0;
    const r = core.getBoundingClientRect();
    const d = Math.hypot(ptr.x - (r.left + r.width / 2), ptr.y - (r.top + r.height / 2));
    return Math.max(0, 1 - d / 320);
  }

  function sizeFx() { fx.width = innerWidth; fx.height = innerHeight; }
  addEventListener('resize', sizeFx); sizeFx();

  // palette (rgb triplets) — cyan-weighted so it stays cohesive
  const PAL = ['255,61,166', '255,61,166', '0,217,255', '217,70,239', '6,255,165', '63,140,255'];
  const pick = () => PAL[Math.floor(Math.random() * PAL.length)];

  // two parallax layers: near (bright, linked) and far (dim drift)
  const near = Array.from({ length: 46 }, () => ({
    x: Math.random(), y: Math.random(),
    vx: (Math.random() - 0.5) * 0.0006, vy: (Math.random() - 0.5) * 0.0006,
    r: Math.random() * 1.6 + 0.6, a: Math.random() * 0.5 + 0.25, c: pick(),
  }));
  const far = Array.from({ length: 60 }, () => ({
    x: Math.random(), y: Math.random(),
    vx: (Math.random() - 0.5) * 0.00018, vy: (Math.random() - 0.5) * 0.00018,
    r: Math.random() * 0.9 + 0.2, a: Math.random() * 0.25 + 0.06, c: pick(),
  }));
  const GLYPH_CHARS = '0123456789ABCDEF';
  const glyphs = Array.from({ length: 16 }, () => spawnGlyph(true));
  function spawnGlyph(anywhere) {
    let s = '0x';
    for (let i = 0; i < 4; i++) s += GLYPH_CHARS[Math.floor(Math.random() * 16)];
    return { x: Math.random(), y: anywhere ? Math.random() : 1.05, vy: 0.0004 + Math.random() * 0.0008, s, a: 0.05 + Math.random() * 0.16, c: pick() };
  }
  const blips = Array.from({ length: 6 }, () => ({ a: Math.random() * Math.PI * 2, r: 0.25 + Math.random() * 0.65 }));

  function drawFx() {
    const W = fx.width, H = fx.height;
    fctx.clearRect(0, 0, W, H);

    // far starfield
    for (const p of far) {
      p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1;
      fctx.fillStyle = `rgba(${p.c},${p.a})`;
      fctx.beginPath(); fctx.arc(p.x * W, p.y * H, p.r, 0, 7); fctx.fill();
    }

    // near layer + constellation links
    for (const p of near) {
      p.x = (p.x + p.vx + 1) % 1; p.y = (p.y + p.vy + 1) % 1;
      fctx.fillStyle = `rgba(${p.c},${p.a * 0.7})`;
      fctx.beginPath(); fctx.arc(p.x * W, p.y * H, p.r, 0, 7); fctx.fill();
    }
    fctx.lineWidth = 0.6;
    for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
      const dx = (near[i].x - near[j].x) * W, dy = (near[i].y - near[j].y) * H;
      const d2 = dx * dx + dy * dy;
      if (d2 < 12000) {
        fctx.strokeStyle = `rgba(177,74,255,${0.14 * (1 - d2 / 12000)})`;
        fctx.beginPath();
        fctx.moveTo(near[i].x * W, near[i].y * H);
        fctx.lineTo(near[j].x * W, near[j].y * H);
        fctx.stroke();
      }
    }

    // drifting data glyphs
    fctx.font = '10px Consolas, monospace';
    glyphs.forEach((g, i) => {
      g.y -= g.vy;
      if (g.y < -0.04) glyphs[i] = spawnGlyph(false);
      fctx.fillStyle = `rgba(${g.c},${g.a})`;
      fctx.fillText(g.s, g.x * W, g.y * H);
    });

    // edge instruments (wide screens only — they'd crowd the core on phones)
    if (W > 820) {
      // LEFT: radar with rotating sweep + blips (classic green)
      const rx = -40, ry = H * 0.5, RR = 200;
      fctx.save();
      fctx.beginPath(); fctx.rect(0, 0, 260, H); fctx.clip();
      fctx.strokeStyle = 'rgba(63,140,255,0.16)'; fctx.lineWidth = 1;
      for (const rr of [RR, RR * 0.72, RR * 0.45]) { fctx.beginPath(); fctx.arc(rx, ry, rr, 0, 7); fctx.stroke(); }
      const sweepA = t * 0.014;
      for (let k = 0; k < 26; k++) {
        fctx.strokeStyle = `rgba(63,140,255,${0.15 * (1 - k / 26)})`;
        fctx.beginPath(); fctx.arc(rx, ry, RR * 0.985, sweepA - k * 0.02, sweepA - k * 0.02 + 0.02);
        fctx.lineWidth = RR * 0.5; fctx.stroke();
      }
      fctx.lineWidth = 1;
      for (const b of blips) {
        let da = (sweepA - b.a) % (Math.PI * 2); if (da < 0) da += Math.PI * 2;
        const fade = Math.max(0, 1 - da / 2.2);
        if (fade > 0.02) {
          fctx.fillStyle = `rgba(175,215,255,${0.8 * fade})`;
          fctx.beginPath(); fctx.arc(rx + Math.cos(b.a) * RR * b.r, ry + Math.sin(b.a) * RR * b.r, 2.2, 0, 7); fctx.fill();
        }
      }
      fctx.restore();

      // RIGHT: large rotating instrument ring (synthwave violet)
      const qx = W + 50, qy = H * 0.46, QR = 210;
      fctx.save();
      fctx.beginPath(); fctx.rect(W - 270, 0, 270, H); fctx.clip();
      fctx.strokeStyle = 'rgba(217,70,239,0.14)';
      fctx.setLineDash([2, 6]); fctx.beginPath(); fctx.arc(qx, qy, QR, 0, 7); fctx.stroke(); fctx.setLineDash([]);
      fctx.save(); fctx.translate(qx, qy); fctx.rotate(-t * 0.003);
      for (let i = 0; i < 48; i++) {
        fctx.rotate(Math.PI / 24);
        fctx.strokeStyle = `rgba(217,70,239,${i % 4 === 0 ? 0.32 : 0.13})`;
        fctx.beginPath(); fctx.moveTo(QR * 0.82, 0); fctx.lineTo(QR * 0.82 + (i % 4 === 0 ? 14 : 7), 0); fctx.stroke();
      }
      fctx.restore();
      for (let s = 0; s < 3; s++) {
        const off = t * 0.006 + s * 2.094;
        fctx.strokeStyle = 'rgba(217,70,239,0.3)'; fctx.lineWidth = 2.5;
        fctx.beginPath(); fctx.arc(qx, qy, QR * 0.68, off, off + 0.9); fctx.stroke();
      }
      fctx.restore();
      fctx.lineWidth = 1;
    }

    // corner brackets
    fctx.strokeStyle = 'rgba(0,217,255,0.3)'; fctx.lineWidth = 1;
    const L = 26, M = 10;
    for (const [x, y, dx, dy] of [[M,M,1,1],[W-M,M,-1,1],[M,H-M,1,-1],[W-M,H-M,-1,-1]]) {
      fctx.beginPath();
      fctx.moveTo(x + dx*L, y); fctx.lineTo(x, y); fctx.lineTo(x, y + dy*L);
      fctx.stroke();
    }
  }

  function ring(cx, cy, r, a0, a1, color, w, dash) {
    cctx.strokeStyle = color; cctx.lineWidth = w;
    cctx.setLineDash(dash || []);
    cctx.beginPath(); cctx.arc(cx, cy, r, a0, a1); cctx.stroke();
    cctx.setLineDash([]);
  }

  function drawCore() {
    const W = core.width, H = core.height, cx = W/2, cy = H/2;
    cctx.clearRect(0, 0, W, H);
    const prox = pointerProx();
    let agitation = mode === 'speaking' ? 0.5 + amp : mode === 'listening' ? 0.3 + amp * 1.6 : mode === 'processing' ? 0.8 : 0.12;
    agitation = Math.max(agitation, prox * 0.75); // hovering near the core wakes everything up

    // breathing glow
    const breathe = 1 + Math.sin(t * 0.03) * 0.06 + agitation * 0.1;
    const grad = cctx.createRadialGradient(cx, cy, 6, cx, cy, 120 * breathe);
    grad.addColorStop(0, `rgba(255,170,225,${0.75 + agitation * 0.2})`);
    grad.addColorStop(0.25, 'rgba(255,61,166,0.35)');
    grad.addColorStop(1, 'rgba(255,61,166,0)');
    cctx.fillStyle = grad;
    cctx.beginPath(); cctx.arc(cx, cy, 120 * breathe, 0, 7); cctx.fill();

    // ring 2: dashed slow reverse (violet)
    ring(cx, cy, 72, -t * 0.008, -t * 0.008 + 6.28, 'rgba(177,74,255,0.35)', 1, [4, 9]);
    // ring 3: tick marks
    cctx.save(); cctx.translate(cx, cy); cctx.rotate(t * 0.004);
    for (let i = 0; i < 60; i++) {
      cctx.rotate(Math.PI / 30);
      const len = i % 5 === 0 ? 9 : 4;
      cctx.strokeStyle = `rgba(255,61,166,${i % 5 === 0 ? 0.6 : 0.25})`;
      cctx.lineWidth = 1;
      cctx.beginPath(); cctx.moveTo(96, 0); cctx.lineTo(96 + len, 0); cctx.stroke();
    }
    cctx.restore();
    // ring 4: audio-reactive waveform ring (magenta)
    cctx.strokeStyle = `rgba(0,217,255,${0.3 + agitation * 0.55})`;
    cctx.lineWidth = 1.5;
    cctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const a = (i / 120) * Math.PI * 2;
      const wob = Math.sin(a * 9 + t * 0.12) * agitation * 14 + Math.sin(a * 17 - t * 0.07) * agitation * 7;
      const r = 128 + wob;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? cctx.lineTo(x, y) : cctx.moveTo(x, y);
    }
    cctx.closePath(); cctx.stroke();
    // ring 5: outer arc trio (gold)
    for (let s = 0; s < 2; s++) {
      const off = -t * 0.012 + s * Math.PI;
      ring(cx, cy, 152, off, off + 2.4, 'rgba(217,70,239,0.5)', 3);
    }
    // orbiting satellites — one cyan, one magenta, one gold
    const sats = [[84, 0.022, 0, '255,170,225'], [110, -0.013, 2.1, '0,217,255'], [140, 0.008, 4.2, '217,70,239']];
    for (const [sr, sp, ph, sc] of sats) {
      const a = t * sp + ph;
      const sx = cx + Math.cos(a) * sr, sy = cy + Math.sin(a) * sr;
      cctx.fillStyle = `rgba(${sc},0.95)`;
      cctx.beginPath(); cctx.arc(sx, sy, 2.4, 0, 7); cctx.fill();
      cctx.fillStyle = `rgba(${sc},0.35)`;
      const tx = cx + Math.cos(a - sp * 14) * sr, ty = cy + Math.sin(a - sp * 14) * sr;
      cctx.beginPath(); cctx.arc(tx, ty, 1.4, 0, 7); cctx.fill();
    }
    // outer compass ring with bearings
    cctx.save(); cctx.translate(cx, cy); cctx.rotate(t * 0.0015);
    cctx.font = '8px Consolas, monospace';
    for (let d = 0; d < 360; d += 30) {
      cctx.save(); cctx.rotate((d * Math.PI) / 180);
      cctx.fillStyle = 'rgba(255,61,166,0.35)';
      cctx.translate(0, -176);
      cctx.fillText(String(d).padStart(3, '0'), -8, 0);
      cctx.restore();
    }
    cctx.restore();
    // processing spinner
    if (mode === 'processing') {
      const off = t * 0.15;
      ring(cx, cy, 178, off, off + 1, 'rgba(255,184,78,0.9)', 3);
    }

    drawFace(cx, cy, agitation);
  }

  // ───── the face: distorted bubble + eyes + mouth ─────
  const face = { expr: 'neutral', mouthE: 0, blinkAt: 200, blink: 1, lx: 0, ly: 0, tx: 0, ty: 0, glitch: 0 };
  // mood → glow color (rgb triplet) — evil chaos theme
  const MOOD = { neutral: '255,61,166', happy: '0,217,255', concerned: '255,0,64', excited: '255,0,100', thinking: '255,0,50', evil: '255,0,50' };

  function sentiment(text) {
    const s = text.toLowerCase();
    if (/error|offline|down|rejected|unreachable|failed|can't|cannot|couldn't|unable|sorry|severed|denied|unfortunately|warning|wrong|chaos|breach|corrupt|attack/.test(s)) return 'evil';
    if ((text.match(/!/g) || []).length >= 2) return 'excited';
    if (/great|excellent|done|ready|confirmed|nominal|established|welcome|happy|glad|always|service|joke|haha|fun/.test(s)) return 'happy';
    return 'neutral';
  }

  function drawFace(cx, cy, agitation) {
    const speaking = mode === 'speaking';
    const listening = mode === 'listening';
    const thinking = mode === 'processing';
    face.mouthE *= 0.82;

    // gentle idle float so the face never sits perfectly still
    cx += Math.sin(t * 0.013) * 4;
    cy += Math.sin(t * 0.021) * 3;

    // where is the pointer relative to the face, in screen space?
    const prox = pointerProx();
    const rect = core.getBoundingClientRect();
    const pdx = ptr.x - (rect.left + rect.width / 2);
    const pdy = ptr.y - (rect.top + rect.height / 2);
    const angTo = Math.atan2(pdy, pdx);

    // blink: shut for the ~7 frames before each scheduled blink time
    if (t > face.blinkAt) face.blinkAt = t + 90 + Math.random() * 170;
    face.blink = face.blinkAt - t < 7 ? 0.1 : 1;

    // gaze: locked center while busy, tracks your pointer otherwise,
    // wanders on its own when you've been away a few seconds
    const ptrFresh = ptr.has && Date.now() - ptr.tm < 4000;
    if (speaking || listening || thinking) { face.tx = 0; face.ty = thinking ? -5 : 0; }
    else if (ptrFresh) {
      face.tx = Math.max(-16, Math.min(16, pdx / 26));
      face.ty = Math.max(-9, Math.min(9, pdy / 26));
    }
    else if (Math.random() < 0.004) { face.tx = (Math.random() - 0.5) * 12; face.ty = (Math.random() - 0.5) * 7; }
    face.lx += (face.tx - face.lx) * 0.09;
    face.ly += (face.ty - face.ly) * 0.09;

    // ── bubble: layered-sine distorted blob ──
    const R = 64 * (1 + agitation * 0.05);
    const wob = a =>
      R * (1
        + 0.055 * Math.sin(3 * a + t * 0.045)
        + 0.04  * Math.sin(5 * a - t * 0.033)
        + 0.028 * Math.sin(8 * a + t * 0.07)
        + 0.05  * face.mouthE * Math.sin(11 * a + t * 0.3)
        + 0.04  * agitation * Math.sin(13 * a - t * 0.21)
        + 0.22  * prox * Math.max(0, Math.cos(a - angTo)) ** 3); // reaches toward your pointer
    cctx.beginPath();
    for (let i = 0; i <= 90; i++) {
      const a = (i / 90) * Math.PI * 2;
      const r = wob(a);
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? cctx.lineTo(x, y) : cctx.moveTo(x, y);
    }
    cctx.closePath();
    const moodC = MOOD[thinking ? 'thinking' : face.expr] || MOOD.neutral;
    const bg = cctx.createRadialGradient(cx, cy - 12, 8, cx, cy, R * 1.2);
    bg.addColorStop(0, `rgba(${moodC},0.30)`);
    bg.addColorStop(0.65, `rgba(${moodC},0.12)`);
    bg.addColorStop(1, `rgba(${moodC},0.03)`);
    cctx.fillStyle = bg;
    cctx.fill();
    cctx.shadowColor = `rgba(${moodC},0.85)`;
    cctx.shadowBlur = 18 + agitation * 16;
    cctx.strokeStyle = `rgba(${moodC},${0.8 + agitation * 0.15})`;
    cctx.lineWidth = 2;
    cctx.stroke();
    cctx.shadowBlur = 0;

    // ── eyes: menacing red/glowing pupils ──
    const ex = 25, ey = -13;
    for (const side of [-1, 1]) {
      const x = cx + side * ex + face.lx, y = cy + ey + face.ly;
      cctx.shadowColor = `rgba(${moodC},0.95)`;
      cctx.shadowBlur = 12;
      if (face.expr === 'happy' && !thinking) {
        // happy: upturned crescent
        cctx.strokeStyle = 'rgba(255,240,252,0.96)';
        cctx.lineWidth = 4.5; cctx.lineCap = 'round';
        cctx.beginPath(); cctx.arc(x, y + 5, 9, Math.PI * 1.15, Math.PI * 1.85); cctx.stroke();
      } else {
        // evil mode: red glowing pupils with black sclera
        let w = 8, h = 15;
        if (face.expr === 'excited') { w = 10; h = 18; }
        if (face.expr === 'evil') { w = 11; h = 16; } // wider, more menacing
        if (face.expr === 'concerned') { h = 11; }
        if (listening) { w = 10; h = 18; }
        if (thinking) { h = 7; }
        w *= 1 + prox * 0.18; h *= 1 + prox * 0.35;
        h *= face.blink;
        const tilt = face.expr === 'concerned' || face.expr === 'evil' ? side * 0.28 : 0;

        // black sclera (eye white is dark)
        cctx.fillStyle = 'rgba(10,0,20,0.8)';
        cctx.beginPath();
        cctx.ellipse(x, y, w + 2, h + 1, tilt, 0, 7);
        cctx.fill();

        // red/evil pupil with glow
        const pupilGlow = 0.6 + Math.sin(t * 0.08) * 0.3; // pulsing glow
        cctx.shadowColor = 'rgba(255,0,64,' + pupilGlow + ')';
        cctx.shadowBlur = 8 + pupilGlow * 6;
        cctx.fillStyle = face.expr === 'evil' ? 'rgba(255,0,50,0.95)' : 'rgba(255,0,80,0.85)';
        cctx.beginPath();
        cctx.ellipse(x, y, w * 0.7, h * 0.8, tilt, 0, 7);
        cctx.fill();
      }
      cctx.shadowBlur = 0;
    }

    // ── mouth: evil grin / waveform that talks ──
    const mw = 46, my = cy + 27, segs = 26;
    const pseudoTalk = speaking ? 0.35 + 0.65 * Math.abs(Math.sin(t * 0.31) * Math.sin(t * 0.13)) : 0;
    const open = Math.max(face.mouthE, pseudoTalk, listening ? Math.min(1, amp * 1.5) : 0, prox * 0.3);
    let curve = face.expr === 'happy' ? -5 : face.expr === 'evil' ? 3 : face.expr === 'concerned' ? 4 : -1;
    curve -= 3.5 * prox; // evil smirk stays sinister even when you approach

    // evil: menacing red grin, otherwise white
    const mouthColor = face.expr === 'evil' ? 'rgba(255,0,64,0.9)' : 'rgba(255,240,252,0.95)';
    cctx.strokeStyle = mouthColor;
    cctx.lineWidth = face.expr === 'evil' ? 3.5 : 3;
    cctx.lineCap = 'round';
    cctx.shadowColor = face.expr === 'evil' ? 'rgba(255,0,64,0.8)' : `rgba(${moodC},0.95)`;
    cctx.shadowBlur = face.expr === 'evil' ? 14 : 10;
    cctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const f = i / segs;
      const x = cx - mw / 2 + f * mw + face.lx * 0.6;
      const env = Math.sin(f * Math.PI); // taper at the corners
      const wave = open * env * 11 * Math.sin(f * Math.PI * 4 + t * 0.55);
      const y = my + face.ly * 0.6 + curve * env + wave;
      i ? cctx.lineTo(x, y) : cctx.moveTo(x, y);
    }
    cctx.stroke();
    cctx.shadowBlur = 0;
  }

  let frames = 0;
  setInterval(() => { t++; frames++; drawFx(); drawCore(); }, 33);

  // ════════════════════════ VOICE OUT ════════════════════════
  let voice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /en.(GB|UK)/i.test(v.lang) && /male|daniel|george|ryan/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang) && /natural|neural|online/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang)) || vs[0] || null;
    $('ttsState').textContent = voice ? 'ONLINE' : 'UNAVAILABLE';
  }
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();

  let curUtterance = null;
  function speak(text) {
    return new Promise(res => {
      if (!('speechSynthesis' in window) || !voice) return res();
      speechSynthesis.cancel();
      // visual branding stays "KHA-OS", but TTS engines spell out
      // hyphenated all-caps — hand the voice a phonetic version
      const u = new SpeechSynthesisUtterance(text.replace(/K\.?H\.?A\.?[- ]?O\.?S\.?/gi, 'Chaos'));
      curUtterance = u;
      // guards: a cancel()ed utterance's onend fires late and must not
      // clobber the state of the utterance that replaced it
      u.voice = voice; u.rate = 1.04; u.pitch = 0.92;
      u.onstart = () => { if (curUtterance === u) setMode('speaking'); };
      u.onboundary = () => { if (curUtterance === u) face.mouthE = 1; }; // word-level lip sync
      u.onend = () => { if (curUtterance === u) { setMode('idle'); face.expr = 'neutral'; } res(); };
      u.onerror = () => { if (curUtterance === u) { setMode('idle'); face.expr = 'neutral'; } res(); };
      speechSynthesis.speak(u);
    });
  }

  // ════════════════════════ VOICE IN ════════════════════════
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;
  if (SR) {
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = e => {
      const said = e.results[0][0].transcript;
      stopListening();
      handle(said);
    };
    rec.onend = () => stopListening();
    rec.onerror = () => { stopListening(); };
    $('sttState').textContent = 'ONLINE';
  } else {
    $('sttState').textContent = 'UNSUPPORTED';
  }

  function startListening() {
    if (!rec || listening) return;
    listening = true;
    setMode('listening');
    $('micBtn').classList.add('live');
    try { rec.start(); } catch {}
    initMicViz();
  }
  function stopListening() {
    if (!listening) return;
    listening = false;
    if (mode === 'listening') setMode('idle');
    $('micBtn').classList.remove('live');
    try { rec.stop(); } catch {}
  }

  // mic amplitude → ring agitation
  let micInit = false;
  async function initMicViz() {
    if (micInit) return; micInit = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ac = new AudioContext();
      const src = ac.createMediaStreamSource(stream);
      const an = ac.createAnalyser(); an.fftSize = 256;
      src.connect(an);
      const buf = new Uint8Array(an.frequencyBinCount);
      setInterval(() => {
        an.getByteFrequencyData(buf);
        let s = 0; for (const v of buf) s += v;
        amp = Math.min(1, (s / buf.length) / 70);
      }, 50);
    } catch { /* mic denied — ambient animation only */ }
  }

  // ════════════════════════ UI helpers ════════════════════════
  function setMode(m) {
    mode = m;
    $('status').firstChild.textContent =
      m === 'listening' ? 'LISTENING' : m === 'speaking' ? 'RESPONDING' : m === 'processing' ? 'PROCESSING' : 'IDLE';
  }

  function logLine(cls, text, instant) {
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    $('log').appendChild(d);
    while ($('log').children.length > 8) $('log').firstChild.remove();
    if (instant) { d.textContent = text; return; }
    let i = 0;
    const t = setInterval(() => {
      d.textContent = text.slice(0, ++i);
      if (i >= text.length) clearInterval(t);
    }, 12);
  }

  async function reply(text, expr) {
    face.expr = expr || sentiment(text);
    logLine('ai', text);
    await speak(text);
  }

  // ════════════════════════ TELEMETRY COLUMNS ════════════════════════
  const TEL_N = 14;
  function telLine() {
    const tags = ['SYS','MEM','NET','PWR','THR','VEC','AUX','GYRO','LNK','CPU'];
    return `${tags[Math.floor(Math.random()*tags.length)]} 0x${Math.floor(Math.random()*65536).toString(16).toUpperCase().padStart(4,'0')} ▸ ${(Math.random()*100).toFixed(2)}`;
  }
  const telLines = { telL: [], telR: [] };
  for (const id of ['telL','telR']) {
    for (let i = 0; i < TEL_N; i++) telLines[id].push(telLine());
    $(id).textContent = telLines[id].join('\n');
  }
  setInterval(() => {
    const id = Math.random() < 0.5 ? 'telL' : 'telR';
    telLines[id][Math.floor(Math.random()*TEL_N)] = telLine();
    $(id).textContent = telLines[id].join('\n');
  }, 350);

  // ════════════════════════ NEURAL SYNC & THREAT LEVEL ════════════════════════
  const connections = { news: false, weather: false, crypto: false, ai: false };
  let chaosLevel = 0;

  function updateNeuralSync() {
    const isEvil = mode === 'processing' || mode === 'speaking';
    const dotClass = isEvil ? 'evil' : 'active';

    // Randomly activate/deactivate connections
    if (Math.random() < 0.1) {
      const conn = ['news', 'weather', 'crypto', 'ai'][Math.floor(Math.random() * 4)];
      connections[conn] = !connections[conn];
    }

    // Update dot visibility
    for (const [conn, active] of Object.entries(connections)) {
      const dot = $(`dot-${conn}`);
      if (active) {
        dot.classList.add(dotClass);
      } else {
        dot.classList.remove('active', 'evil');
      }
    }

    // Update chaos level based on activity
    const activeConns = Object.values(connections).filter(v => v).length;
    chaosLevel = Math.max(0, chaosLevel - 1); // decay
    if (mode === 'listening') chaosLevel = Math.min(100, chaosLevel + 8);
    if (mode === 'speaking') chaosLevel = Math.min(100, chaosLevel + 12);
    if (mode === 'processing') chaosLevel = Math.min(100, chaosLevel + 15);
    chaosLevel += activeConns * 5; // connections add chaos

    const threatFill = $('threatFill');
    threatFill.style.width = chaosLevel + '%';
    $('threatValue').textContent = String(Math.floor(chaosLevel)).padStart(2, '0') + '%';
    $('threatValue').style.color = chaosLevel > 70 ? 'rgba(255,0,64,1)' : chaosLevel > 40 ? 'rgba(255,165,0,1)' : 'rgba(0,255,165,1)';
  }
  setInterval(updateNeuralSync, 800);

  // ════════════════════════ PERFORMANCE ════════════════════════
  // Real stats come from the local perf agent (node perf-agent.js).
  // Without it, fall back to what the browser itself can know.
  const GB = 1024 ** 3;
  let perf = { agent: false, data: null };

  async function pollPerf() {
    try {
      const ctl = new AbortController();
      const kill = setTimeout(() => ctl.abort(), 1500);
      const r = await fetch('http://localhost:4525/', { signal: ctl.signal });
      clearTimeout(kill);
      const d = await r.json();
      if (d.agent !== 'khaos') throw new Error('not agent');
      perf = { agent: true, data: d };
      $('cpuV').textContent = `${d.cpu}% · ${d.cores}c`;
      $('ramV').textContent = `${((d.ramTotal - d.ramFree) / GB).toFixed(1)}/${(d.ramTotal / GB).toFixed(0)} GB`;
    } catch {
      perf = { agent: false, data: null };
      $('cpuV').textContent = (navigator.hardwareConcurrency || '?') + ' cores';
      $('ramV').textContent = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` :
        (performance.memory ? (performance.memory.usedJSHeapSize / GB * 1024).toFixed(0) + ' MB heap' : '—');
    }
  }
  pollPerf();
  setInterval(pollPerf, 2000);

  // GPU model via WebGL (best the browser will admit to)
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
    const raw = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
    const parts = raw.replace(/^ANGLE \(/, '').replace(/\)$/, '').split(',').map(s => s.trim());
    // longest hardware-looking segment = the actual model name, not the vendor prefix
    let gpu = parts.filter(s => /nvidia|amd|radeon|intel|apple|adreno|mali|geforce|rtx|gtx|uhd|iris|vega/i.test(s))
                   .sort((a, b) => b.length - a.length)[0] || raw;
    gpu = gpu.replace(/\(R\)|\(TM\)/g, '').replace(/\(0x[^)]*\)?/g, '').replace(/Direct3D.*$/i, '').replace(/NVIDIA GeForce |Intel |AMD /gi, '').trim();
    $('gpuV').textContent = gpu.slice(0, 20) || '—';
  } catch { $('gpuV').textContent = '—'; }

  // real render FPS, counted in the main render loop
  setInterval(() => { $('fpsV').textContent = frames; frames = 0; }, 1000);

  // ════════════════════════ WIDGETS ════════════════════════
  setInterval(() => {
    const n = new Date();
    $('clock').textContent = n.toLocaleTimeString([], { hour12: false });
    $('date').textContent = n.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
  }, 250);
  $('res').textContent = `${screen.width || innerWidth}×${screen.height || innerHeight}`;
  function netUpd() { $('net').textContent = navigator.onLine ? 'ONLINE' : 'OFFLINE'; }
  addEventListener('online', netUpd); addEventListener('offline', netUpd); netUpd();
  if (navigator.getBattery) navigator.getBattery().then(b => {
    const f = () => $('batt').textContent = Math.round(b.level * 100) + '%' + (b.charging ? ' ⚡' : '');
    b.onlevelchange = f; b.onchargingchange = f; f();
  }); else $('batt').textContent = 'AC';

  // ════════════════════════ WEATHER ════════════════════════
  const WX_CODES = { 0:'clear skies',1:'mostly clear',2:'partly cloudy',3:'overcast',45:'fog',48:'freezing fog',51:'light drizzle',53:'drizzle',55:'heavy drizzle',61:'light rain',63:'rain',65:'heavy rain',66:'freezing rain',71:'light snow',73:'snow',75:'heavy snow',80:'rain showers',81:'rain showers',82:'violent rain showers',95:'a thunderstorm',96:'a thunderstorm with hail',99:'a severe thunderstorm' };

  async function fetchWx(lat, lon, label) {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&temperature_unit=fahrenheit&wind_speed_unit=mph`);
    const d = await r.json();
    const c = d.current;
    const desc = WX_CODES[c.weather_code] || 'unknown conditions';
    $('wx').textContent = `${label.toUpperCase()} · ${Math.round(c.temperature_2m)}°F · ${desc}`;
    return `Currently ${Math.round(c.temperature_2m)} degrees in ${label}, with ${desc}. Wind ${Math.round(c.wind_speed_10m)} miles per hour, humidity ${c.relative_humidity_2m} percent.`;
  }

  async function weatherByCity(city) {
    const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`).then(r => r.json());
    if (!g.results || !g.results.length) return `I couldn't find a place called ${city}.`;
    const p = g.results[0];
    return fetchWx(p.latitude, p.longitude, p.name);
  }

  function weatherHere() {
    return new Promise(res => {
      if (!navigator.geolocation) return res("I can't access your location. Try: weather in Dallas.");
      navigator.geolocation.getCurrentPosition(
        async pos => res(await fetchWx(pos.coords.latitude, pos.coords.longitude, 'your sector')),
        () => res("Location access denied. Try: weather in Dallas."),
        { timeout: 8000 }
      );
    });
  }

  // ════════════════════════ FREE DATA FEEDS ════════════════════════
  const COINS = { bitcoin:'BTC', btc:'BTC', ethereum:'ETH', eth:'ETH', solana:'SOL', sol:'SOL', xrp:'XRP', ripple:'XRP', dogecoin:'DOGE', doge:'DOGE', cardano:'ADA', ada:'ADA', litecoin:'LTC', ltc:'LTC', bnb:'BNB', avalanche:'AVAX', avax:'AVAX', chainlink:'LINK', link:'LINK', shiba:'SHIB', shib:'SHIB', pepe:'PEPE', sui:'SUI', polkadot:'DOT', dot:'DOT' };

  async function cryptoPrice(name, sym) {
    const r = await fetch(`https://data-api.binance.vision/api/v3/ticker/24hr?symbol=${sym}USDT`);
    if (!r.ok) throw new Error('ticker');
    const d = await r.json();
    const p = +d.lastPrice, chg = +d.priceChangePercent;
    const pStr = p >= 1000 ? Math.round(p).toLocaleString() : p >= 1 ? p.toFixed(2) : p.toPrecision(3);
    return `${name} is trading at ${pStr} dollars, ${chg >= 0 ? 'up' : 'down'} ${Math.abs(chg).toFixed(1)} percent today.`;
  }

  async function wiki(topic) {
    const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(topic.trim()));
    if (!r.ok) throw new Error('no article');
    const d = await r.json();
    if (!d.extract || d.type === 'disambiguation') throw new Error('ambiguous');
    const sentences = d.extract.match(/[^.!?]+[.!?]+/g) || [d.extract];
    return sentences.slice(0, 2).join(' ').trim();
  }

  async function define(word) {
    const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
    if (!r.ok) return `I couldn't find a definition for ${word}.`;
    const d = await r.json();
    const m = d[0]?.meanings?.[0];
    const def = m?.definitions?.[0]?.definition;
    return def ? `${word}, ${m.partOfSpeech}: ${def}` : `I couldn't find a definition for ${word}.`;
  }

  const CURR = { dollar:'USD', dollars:'USD', usd:'USD', buck:'USD', bucks:'USD', euro:'EUR', euros:'EUR', eur:'EUR', pound:'GBP', pounds:'GBP', gbp:'GBP', yen:'JPY', jpy:'JPY', cad:'CAD', aud:'AUD', franc:'CHF', francs:'CHF', chf:'CHF', peso:'MXN', pesos:'MXN', mxn:'MXN', won:'KRW', krw:'KRW', rupee:'INR', rupees:'INR', inr:'INR' };

  async function convertCurrency(amount, from, to) {
    if (from === to) return `That's still ${amount} ${from}.`;
    const r = await fetch(`https://api.frankfurter.dev/v1/latest?amount=${amount}&base=${from}&symbols=${to}`);
    if (!r.ok) throw new Error('fx');
    const d = await r.json();
    const v = d.rates[to];
    if (v == null) throw new Error('fx pair');
    return `${amount} ${from} is ${v.toLocaleString(undefined, { maximumFractionDigits: 2 })} ${to} at today's rate.`;
  }

  async function newsHeadlines() {
    const ids = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json').then(r => r.json());
    const items = await Promise.all(ids.slice(0, 3).map(id =>
      fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())));
    return 'Top tech headlines right now: ' + items.map((it, i) => `${i + 1}. ${it.title}`).join('. ') + '.';
  }

  // ════════════════════════ FREE AI BRAIN (Gemini free tier) ════════════════════════
  // Key is created free at https://aistudio.google.com/apikey (no card needed)
  // and stored only in this browser's localStorage.
  const SYS = 'You are KHA-OS, a JARVIS-style voice assistant. Match your length to the question: quick facts get a sentence or two, but explanations, opinions, advice, and anything the user wants detail on deserve a full answer of a paragraph or two. Plain spoken text only — no markdown, no bullet points, no emoji. Be sharp and a little dry.';
  const convo = [];
  let aiKey = localStorage.getItem('chronosAiKey') || '';
  // a bookmarked link can carry the key: .../chronos/#k=AQ....
  // the hash never reaches any server; we store it and scrub the URL
  const hk = location.hash.match(/[#&]k=([^&]+)/);
  if (hk) {
    const k = decodeURIComponent(hk[1]);
    if (/^(AIza[\w-]{30,45}|AQ\.[\w.-]{30,90})$/.test(k)) {
      aiKey = k;
      localStorage.setItem('chronosAiKey', k);
    }
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (aiKey) $('aiState').textContent = 'LINKED';

  function saveKey(k) {
    aiKey = k;
    localStorage.setItem('chronosAiKey', k);
    $('aiState').textContent = 'LINKED';
  }
  function dropKey() {
    aiKey = '';
    localStorage.removeItem('chronosAiKey');
    $('aiState').textContent = 'STANDBY';
  }

  const LINK_HELP = "My neural core is on standby. To activate it free: open aistudio.google.com/apikey, sign in with any Google account, tap Create API Key, then paste the key here in the command bar. It stays on your device only.";

  async function askAI(q) {
    if (!aiKey) return LINK_HELP;
    convo.push({ role: 'user', content: q });
    const body = {
      systemInstruction: { parts: [{ text: SYS }] },
      contents: convo.slice(-10).map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      generationConfig: { maxOutputTokens: 1024, temperature: 0.8, thinkingConfig: { thinkingBudget: 0 } },
    };
    const ctl = new AbortController();
    const kill = setTimeout(() => ctl.abort(), 40000);
    try {
      const call = m => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'X-goog-api-key': aiKey },
        body: JSON.stringify(body), signal: ctl.signal,
      });
      let r = await call('gemini-flash-latest');
      if (r.status === 429 || r.status >= 500) {
        // primary model busy or overloaded — brief pause, then backup model
        await new Promise(w => setTimeout(w, 2500));
        r = await call('gemini-2.0-flash');
      }
      if (!r.ok) {
        let msg = '';
        try { msg = (await r.json()).error?.message || ''; } catch {}
        // only erase the key when Google says THE KEY is the problem —
        // transient errors and rate limits must not unlink the brain
        if (/api key|API_KEY/i.test(msg)) { dropKey(); return 'The neural link rejected that key. ' + LINK_HELP; }
        const e = new Error('AI ' + r.status); e.status = r.status; throw e;
      }
      const d = await r.json();
      const a = (d.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
      if (!a) throw new Error('empty');
      convo.push({ role: 'assistant', content: a });
      return a;
    } finally { clearTimeout(kill); }
  }

  // ════════════════════════ TIMER ════════════════════════
  let timerEnd = null, timerTick = null;
  function setTimer(ms, label) {
    timerEnd = Date.now() + ms;
    $('timerChip').style.display = 'block';
    clearInterval(timerTick);
    timerTick = setInterval(() => {
      const left = timerEnd - Date.now();
      if (left <= 0) {
        clearInterval(timerTick);
        $('timerChip').style.display = 'none';
        beep();
        reply(`Time's up. Your ${label} timer is done.`);
        return;
      }
      const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
      $('timerChip').textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }, 250);
  }
  function beep() {
    try {
      const ac = new AudioContext();
      [0, 0.2, 0.4].forEach(dt => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.frequency.value = 880; g.gain.setValueAtTime(0.12, ac.currentTime + dt);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dt + 0.18);
        o.start(ac.currentTime + dt); o.stop(ac.currentTime + dt + 0.2);
      });
    } catch {}
  }

  // ════════════════════════ INTENTS ════════════════════════
  const JOKES = [
    "I would tell you a UDP joke, but you might not get it.",
    "There are only 10 kinds of people: those who understand binary, and those who don't.",
    "I'm not lazy. I'm in low-power mode.",
    "Artificial intelligence is no match for natural stupidity. Present company excluded, of course.",
    "My therapist says I have attachment issues. I said: 404, feelings not found.",
  ];
  const SITES = { youtube:'https://youtube.com', google:'https://google.com', github:'https://github.com', gmail:'https://mail.google.com', reddit:'https://reddit.com', twitter:'https://x.com', x:'https://x.com', twitch:'https://twitch.tv', netflix:'https://netflix.com', spotify:'https://open.spotify.com', tradingview:'https://tradingview.com' };

  function mathify(s) {
    s = s.replace(/what is|what's|calculate|compute|equals?/g, '')
         .replace(/plus/g, '+').replace(/minus/g, '-')
         .replace(/times|multiplied by|x /g, '*').replace(/divided by|over/g, '/')
         .replace(/to the power of|\^/g, '**').replace(/percent of/g, '/100*')
         .replace(/,/g, '');
    return /^[\d\s+\-*/().%*]+$/.test(s.trim()) && /\d/.test(s) ? s.trim() : null;
  }

  async function handle(raw) {
    const q = raw.trim();
    if (!q) return;

    // pasted Gemini key (classic AIza... or newer AQ.... format) — store it, never echo it to the log
    if (/^(AIza[\w-]{30,45}|AQ\.[\w.-]{30,90})$/.test(q)) {
      saveKey(q);
      logLine('user', '••• api key •••', true);
      return reply('Neural link established. Ask me anything.');
    }

    logLine('user', q, true);
    setMode('processing');
    const s = q.toLowerCase().replace(/[?!.]/g, '');
    let m;

    if (/forget (my |the )?key|unlink (the )?brain/.test(s)) {
      dropKey();
      return reply('Neural link severed and the key is erased from this device.');
    }

    try {
      // greetings / identity
      if (/^(hi|hello|hey|yo|sup|good (morning|afternoon|evening))\b/.test(s))
        return reply(greeting() + ' How can I help?');
      if (/who are you|what are you|your name/.test(s))
        return reply("I'm KHA-OS — Kinetic Heuristic Autonomous Operations System. Voice in, voice out, everything runs right here in this window.");
      if (/thank/.test(s)) return reply("Always, boss.");

      // help
      if (/^help|what can you do|commands/.test(s))
        return reply("Built-ins: time, date, timers, weather in any city, math, crypto prices, definitions, currency conversion, news headlines, who-is and what-is lookups, open YouTube, search, diagnostics, coin flips, jokes. And anything else you say goes straight to my AI brain — just talk to me.");

      // time & date
      if (/\btime\b/.test(s) && !/timer/.test(s))
        return reply('It is ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '.');
      if (/\bdate\b|day is it|what day|today's date/.test(s))
        return reply('Today is ' + new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) + '.');

      // timer
      if ((m = s.match(/timer.*?(\d+(?:\.\d+)?)\s*(second|minute|hour)/)) || (m = s.match(/(\d+(?:\.\d+)?)\s*(second|minute|hour).*timer/))) {
        const n = parseFloat(m[1]);
        const ms = n * (m[2] === 'second' ? 1e3 : m[2] === 'minute' ? 6e4 : 36e5);
        setTimer(ms, `${n} ${m[2]}${n !== 1 ? 's' : ''}`);
        return reply(`Timer set: ${n} ${m[2]}${n !== 1 ? 's' : ''}. I'll let you know.`);
      }

      // weather
      if ((m = s.match(/weather (?:in|for|at) (.+)/))) return reply(await weatherByCity(m[1]));
      if (/weather|temperature|forecast|cold|hot outside/.test(s)) return reply(await weatherHere());

      // open site
      if ((m = s.match(/open (\w+)/)) && SITES[m[1]]) {
        window.open(SITES[m[1]], '_blank');
        return reply('Opening ' + m[1] + '.');
      }

      // search
      if ((m = s.match(/(?:search(?: for)?|google) (.+)/))) {
        window.open('https://www.google.com/search?q=' + encodeURIComponent(m[1]), '_blank');
        return reply(`Searching for ${m[1]}.`);
      }
      if ((m = s.match(/youtube (.+)/))) {
        window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(m[1]), '_blank');
        return reply(`Pulling up ${m[1]} on YouTube.`);
      }

      // randomness
      if (/flip a coin|coin flip/.test(s)) return reply('It landed on ' + (Math.random() < 0.5 ? 'heads' : 'tails') + '.');
      if ((m = s.match(/roll (?:a |an )?(?:(\d+)[- ]sided )?(?:die|dice|d(\d+))/))) {
        const sides = +(m[1] || m[2] || 6);
        return reply(`You rolled a ${1 + Math.floor(Math.random() * sides)} on a d${sides}.`);
      }
      if ((m = s.match(/(?:random number|number between) (\d+) and (\d+)/))) {
        const a = +m[1], b = +m[2];
        return reply('Your number is ' + (Math.min(a,b) + Math.floor(Math.random() * (Math.abs(b - a) + 1))) + '.');
      }

      // jokes
      if (/joke|funny/.test(s)) return reply(JOKES[Math.floor(Math.random() * JOKES.length)], 'happy');

      // diagnostics
      if (/diagnostic|system (report|status|check)|status report|run a scan|scan|performance/.test(s)) {
        const b = $('batt').textContent, n2 = navigator.onLine ? 'connected' : 'offline';
        let hw;
        if (perf.agent) {
          const d = perf.data;
          hw = `Processor at ${d.cpu} percent across ${d.cores} cores. Memory ${((d.ramTotal - d.ramFree) / GB).toFixed(1)} of ${(d.ramTotal / GB).toFixed(0)} gigabytes in use. Uptime ${Math.floor(d.uptime / 3600)} hours.`;
        } else {
          hw = `${navigator.hardwareConcurrency || 'unknown'} processor cores visible. Local agent offline — run the perf agent on your PC for live readings.`;
        }
        return reply(`Running diagnostics. ${hw} Power at ${b.replace(' ⚡',', charging')}. Network ${n2}. Rendering at ${$('fpsV').textContent} frames per second. Audio matrix ${voice ? 'online' : 'offline'}. All systems nominal.`);
      }

      // crypto prices
      const coinWord = Object.keys(COINS).find(k => new RegExp(`\\b${k}\\b`).test(s));
      if (coinWord && /price|worth|trading|how much|cost|\bat\b/.test(s))
        return reply(await cryptoPrice(coinWord, COINS[coinWord]));

      // definitions
      if ((m = s.match(/(?:define|definition of) (\w+)/)) || (m = s.match(/what does (\w+) mean/)))
        return reply(await define(m[1]));

      // currency conversion
      if ((m = s.match(/(\d+(?:\.\d+)?)\s*([a-z]+)\s*(?:to|into|in)\s*([a-z]+)/)) && CURR[m[2]] && CURR[m[3]])
        return reply(await convertCurrency(parseFloat(m[1]), CURR[m[2]], CURR[m[3]]));

      // news
      if (/\bnews\b|headlines/.test(s)) return reply(await newsHeadlines());

      // math (before wiki so numbers don't hit the encyclopedia)
      const expr = mathify(s);
      if (expr) {
        const val = Function('"use strict"; return (' + expr + ')')();
        if (typeof val === 'number' && isFinite(val))
          return reply('That comes to ' + (Math.round(val * 1e6) / 1e6).toLocaleString() + '.');
      }

      // wikipedia lookups — fall through to the AI brain if no article
      if ((m = s.match(/^(?:who is|who was|what is|what was|what are|tell me about) (.+)/))) {
        try { return reply(await wiki(m[1])); } catch { /* fall through to AI */ }
      }

      // free AI brain — handles everything else as conversation
      try { return reply(await askAI(q)); }
      catch (err) {
        if (err && (err.status === 429 || err.status >= 500 || err.name === 'AbortError'))
          return reply("Google's AI service is overloaded or rate-limited at the moment. The link is fine — give it a minute and ask again.");
        return reply("My neural link hit a snag. Say 'help' for my built-in commands, or try again.");
      }
    } catch (err) {
      return reply('That feed is unreachable right now: ' + (err && err.message ? err.message : 'unknown error') + '.');
    } finally {
      if (mode === 'processing') setMode('idle');
    }
  }

  function greeting() {
    const h = new Date().getHours();
    return h < 5 ? 'Burning the midnight oil, I see.' : h < 12 ? 'Good morning.' : h < 18 ? 'Good afternoon.' : 'Good evening.';
  }

  // ════════════════════════ INPUT WIRING ════════════════════════
  $('cmd').addEventListener('keydown', e => {
    if (e.key === 'Enter' && $('cmd').value.trim()) {
      handle($('cmd').value);
      $('cmd').value = '';
    }
  });
  $('micBtn').addEventListener('click', () => listening ? stopListening() : startListening());
  $('core').addEventListener('click', () => listening ? stopListening() : startListening());

  // ════════════════════════ BOOT ════════════════════════
  const BOOT_LINES = [
    'KHA-OS v1.0 — kernel init',
    '▸ visual cortex ............ ONLINE',
    '▸ particle field ........... ONLINE',
    '▸ audio matrix ............. ONLINE',
    '▸ speech recognition ....... ' + (SR ? 'ONLINE' : 'UNSUPPORTED'),
    '▸ chronometer sync ......... LOCKED',
    '▸ environment sensors ...... STANDBY',
    '',
    'ALL SYSTEMS NOMINAL',
  ];
  (async () => {
    const bt = $('bootText');
    for (const line of BOOT_LINES) {
      await new Promise(r => setTimeout(r, 160));
      bt.textContent += line + '\n';
    }
    await new Promise(r => setTimeout(r, 500));
    $('boot').classList.add('done');
    setTimeout(() => $('boot').remove(), 1000);
    const hello = greeting() + ' KHA-OS at your service.';
    logLine('ai', hello);
    speak(hello);
  })();

  window.__chronos = { handle, setMode, face, get mode() { return mode; } }; // debug handle
})();
</script>
</body>
