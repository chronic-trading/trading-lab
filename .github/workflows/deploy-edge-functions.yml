name: Deploy edge functions

# Why this exists.
#
# validate-whop is the licence check — the single call standing between a
# stranger and a paid product. It lived only in the Supabase dashboard, with no
# link to this repo, so the deployed copy and the source drifted apart without
# anything noticing: a commit removed the hardcoded TRADINGLAB-TEST-2026
# fallback, and weeks later that key still validated in production because the
# function was never redeployed. A security fix that only exists in git is not a
# security fix.
#
# Now the repo is the source of truth. Any push that touches the function
# deploys it.
#
# Requires two repository secrets, both set in GitHub's UI:
#   SUPABASE_ACCESS_TOKEN  - a personal access token from
#                            supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_ID    - the project ref (hgvktmjqegywjrwbkipv)
#
# Function SECRETS (WHOP_API_KEY, TEST_LICENSE_KEY) are deliberately NOT set
# here. Those stay in the Supabase dashboard, so a repo secret leak cannot also
# hand over the Whop account.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy validate-whop
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${PROJECT_ID}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_ID must be set as repository secrets."
            exit 1
          fi
          # --no-verify-jwt: the licence check is called by signed-out visitors,
          # so it must accept unauthenticated requests. It does its own
          # validation against Whop.
          supabase functions deploy validate-whop \
            --project-ref "${PROJECT_ID}" \
            --no-verify-jwt

      - name: Confirm the deployed copy rejects a junk key
        run: |
          set -euo pipefail
          # A deploy that reports success but leaves the paywall fail-open is the
          # exact failure this workflow exists to catch, so prove it rather than
          # trust the exit code.
          sleep 5
          body=$(curl -sS --max-time 20 \
            -X POST "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/validate-whop" \
            -H "Content-Type: application/json" \
            -d '{"key":"ci-smoke-test-not-a-real-key"}')
          echo "Response: ${body}"
          case "${body}" in
            *'"valid":false'*) echo "Junk key rejected — paywall is closed." ;;
            *) echo "::error::Junk key was NOT rejected. The deployed function is fail-open."; exit 1 ;;
          esac
